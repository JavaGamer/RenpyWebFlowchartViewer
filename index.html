<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Ren'Py Web Flowchart Viewer</title>
    <meta
      name="description"
      content="Visualize script structure, search dialogue, and export flowcharts locally in your browser with zero server data upload."
    />
    <link
      rel="canonical"
      href="https://javagamer.github.io/RenpyWebFlowchartViewer/"
    />
    <link rel="manifest" href="/site.webmanifest" />
    <meta name="color-scheme" content="light dark" />
    <meta
      name="theme-color"
      content="#ffffff"
      media="(prefers-color-scheme: light)"
    />
    <meta
      name="theme-color"
      content="#0f172a"
      media="(prefers-color-scheme: dark)"
    />

    <!-- Open Graph protocol -->
    <meta property="og:title" content="Ren'Py Web Flowchart Viewer" />
    <meta
      property="og:description"
      content="Visualize script structure, search dialogue, and export flowcharts locally in your browser."
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://javagamer.github.io/RenpyWebFlowchartViewer/"
    />
    <meta
      property="og:image"
      content="https://javagamer.github.io/RenpyWebFlowchartViewer/favicon.svg"
    />

    <!-- Structured Data (JSON-LD) -->
    <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "WebApplication",
      "name": "Ren'Py Web Flowchart Viewer",
      "url": "https://javagamer.github.io/RenpyWebFlowchartViewer/",
      "description": "Visualize script structure, search dialogue, and export flowcharts locally in your browser.",
      "applicationCategory": "DeveloperApplication",
      "operatingSystem": "Any",
      "browserRequirements": "Requires JavaScript"
    }
    </script>

    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Outfit:wght@400;500;600;700;800&display=swap"
      rel="stylesheet"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
