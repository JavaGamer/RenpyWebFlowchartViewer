name: CI

on:
  push:
  pull_request:

jobs:
  ci:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true

      - name: Install dependencies
        run: deno install

      - name: Lint
        run: deno task lint

      - name: Build
        run: deno task build

      - name: Install Playwright Chromium
        run: deno run -A npm:playwright install chromium --with-deps

      - name: Test
        run: deno task test

      - name: Coverage
        run: deno task test:coverage

      - name: Commit and push updated lockfile
        if: github.event_name == 'push'
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add deno.lock
          if ! git diff-index --quiet HEAD; then
            git commit -m "chore: auto-update deno.lock [skip ci]"
            git push
          fi

  smoke-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v6
      - name: Set up Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x
          cache: true
      - name: Install dependencies
        run: deno install
      - name: Production smoke build
        run: deno task build
